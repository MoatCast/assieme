[package]
name = "assieme-brain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
assieme-core = { path = "../assieme-core" }
glob = "0.3"
jiff = "1"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2.0.1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
uuid = { version = "1.29.3", features = ["v4"] }

# C code, and the crate is unix-only: Windows never builds it.
[target.'cfg(unix)'.dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }

[lints]
workspace = true
