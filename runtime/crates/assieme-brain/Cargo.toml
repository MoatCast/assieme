[package]
name = "assieme-brain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
assieme-core = { path = "../assieme-core" }
clap = { version = "4", features = ["derive"] }
glob = "0.3"
jiff = "1"
libc = "0.2"
regex = "1"
rmcp = { version = "3", features = ["server", "macros", "transport-io", "elicitation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.10"
shlex = "2"
tempfile = "3"
toml = { version = "1", default-features = false, features = ["parse", "display", "serde"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

# The brain is unix-only; this keeps the Windows type-check from compiling SQLite.
[target.'cfg(unix)'.dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }

[lints]
workspace = true
