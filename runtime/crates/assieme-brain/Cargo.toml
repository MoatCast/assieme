[package]
name = "assieme-brain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
assieme-core = { path = "../assieme-core" }
glob = "0.3"
jiff = "1"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
