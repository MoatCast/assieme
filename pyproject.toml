[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "assieme"
version = "0.1.0"
description = "Who woke whom in multi-agent coding teams, what each wake cost, and which commands keep being refused."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]  # only `assieme mcp` imports it; the brain stays standard library

[project.scripts]
assieme = "assieme.cli:main"

[tool.setuptools]
packages = ["assieme"]

[tool.setuptools.package-data]
assieme = ["practices.toml", "presets/*/*", "presets/briefs/*", "guide/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
